<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="margin-top:80px;border-top:1px solid rgba(32,31,29,.16);background:#eae9e9;font-family:'Lora',Georgia,serif;color:#201f1d">
  <div style="max-width:1160px;margin:0 auto;padding:34px 44px 40px;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:40px">
    <div>
      <div style="display:flex;align-items:center;gap:11px">
        <img src="images/logo.png" alt="OneMaple" style="width:30px;height:30px;mix-blend-mode:multiply">
        <span style="font:600 16px/1 'Cormorant Garamond',serif;letter-spacing:.04em">OneMaple</span>
      </div>
      <p style="font:400 12.5px/1.7 'Lora',serif;color:rgba(32,31,29,.55);margin:12px 0 0;max-width:34ch"><span lang="en">Set in Cormorant Garamond and Lora. Built by hand, revised slowly. © 2026 Fengyi Zhang.</span><span lang="zh">正文 Lora，标题 Cormorant Garamond。手写，慢改。© 2026 张丰毅。</span></p>
    </div>
    <div style="display:flex;flex-direction:column;gap:9px;font:400 13px/1.4 'Lora',serif">
      <span style="font:600 10px/1 'Cormorant Garamond',serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(32,31,29,.45);margin-bottom:3px">Rooms</span>
      <span onClick="{{ go.work }}" style="cursor:pointer" style-hover="color:#b68235">Work 履历</span>
      <span onClick="{{ go.projects }}" style="cursor:pointer" style-hover="color:#b68235">Projects 作品</span>
      <span onClick="{{ go.photo }}" style="cursor:pointer" style-hover="color:#b68235">Photographs 摄影</span>
      <span onClick="{{ go.books }}" style="cursor:pointer" style-hover="color:#b68235">Bookshelf 书架</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:9px;font:400 13px/1.4 'Lora',serif">
      <span style="font:600 10px/1 'Cormorant Garamond',serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(32,31,29,.45);margin-bottom:3px">Reach</span>
      <a href="mailto:me.fzhang@gmail.com" style="color:#201f1d;text-decoration:none" style-hover="color:#b68235">me.fzhang@gmail.com</a>
      <a href="https://github.com/onemapl3" target="_blank" style="color:#201f1d;text-decoration:none" style-hover="color:#b68235">GitHub</a>
      <a href="https://www.linkedin.com/in/fengyizhang-profile/" target="_blank" style="color:#201f1d;text-decoration:none" style-hover="color:#b68235">LinkedIn</a>
      <span onClick="{{ go.contact }}" style="cursor:pointer;color:#b68235">Write a letter →</span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1160,&quot;height&quot;:200},&quot;go&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, () =&gt; void&gt;&quot;}}"></script>
</body>
</html>
